# Secure Messenger — nginx server block for zebra.theburkenator.com
#
# Drop this file at /etc/nginx/sites-available/ and symlink into sites-enabled.
# Cert paths assume certbot has been run (see deploy/nginx/README.md).
#
# Architecture:
#   [client] ──TLS 1.2/1.3──▶ [nginx :443] ──HTTP loopback──▶ [node :3000]
#   nginx is the only process bound to a public interface.

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────
# Keep port 80 alive solely for (a) HTTP→HTTPS redirect and (b) the
# Let's Encrypt HTTP-01 challenge under /.well-known/acme-challenge/.
server {
    listen 80;
    listen [::]:80;
    server_name zebra.theburkenator.com;

    # Allow certbot renewals to land without a redirect dance
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zebra.theburkenator.com;

    # Certbot drops the chain + key here after `certbot --nginx`
    ssl_certificate     /etc/letsencrypt/live/zebra.theburkenator.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zebra.theburkenator.com/privkey.pem;

    # Modern TLS only. TLS 1.0/1.1 are deprecated by RFC 8996; SSL 3 is broken.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # Mozilla "intermediate" cipher suite — broad client support, no weak primitives.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling — clients verify the cert without an extra round-trip to the CA
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security headers ────────────────────────────────────────────────
    # HSTS — 2 years, include subdomains, preload-eligible. Once a client
    # has seen this, it will refuse to talk to *.theburkenator.com over plain HTTP.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # No CSP here — this server is an API. Add one if you start serving HTML.

    server_tokens off;

    # ── Proxy to Node ───────────────────────────────────────────────────
    # Body size cap matches express.json({ limit: '1mb' }) on the Node side.
    # If you tighten the Node limit, tighten this too.
    client_max_body_size 1m;

    # Per-connection rate guard. The Node app does per-IP rate limiting via
    # express-rate-limit, but limit_req in nginx gives an extra ceiling at
    # the edge so abusive clients never reach Node at all.
    # (The zone is declared in /etc/nginx/conf.d/rate-limit.conf — see README.)
    limit_req zone=api burst=20 nodelay;

    # ── Block access to sensitive paths ────────────────────────────────

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Source-control directories anywhere in the path (defense if a future
    # `root` directive points at a checked-out repo)
    location ~ /(\.git|\.svn|\.hg|\.bzr)(/|$) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Build manifests and lockfiles. node_modules, package.json, and the
    # lockfile leak the dependency tree (versions => known CVEs).
    location ~* /(package\.json|package-lock\.json|yarn\.lock|composer\.json|composer\.lock|Gemfile(\.lock)?|requirements\.txt|Pipfile(\.lock)?)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
    location ~ /node_modules(/|$) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Backup, swap, and editor temp files left behind by careless deploys
    location ~* \.(bak|backup|old|orig|original|swp|swo|swn|tmp|log|sql|sqlite|db|dump|cache|sublime-.*|tar|tar\.gz|tgz|zip|rar|7z)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Files ending in ~ (vim/emacs backups)
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Environment / config files anywhere in the path
    location ~* /(\.env|env\..*|config\.json|settings\.json|secrets\.json|credentials\.json)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # CI / IDE / editor metadata
    location ~ /(\.github|\.gitlab|\.circleci|\.travis\.yml|\.vscode|\.idea|\.editorconfig)(/|$) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Forward the original client info so express's `trust proxy 1`
        # populates req.ip with the real client address (used by the
        # auth rate limiter) and so HSTS / OAuth-style redirects on the
        # Node side know they're behind HTTPS.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Don't buffer streamed responses (no streaming today, but cheap to set)
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /api/health {
        access_log off;
        proxy_pass http://127.0.0.1:3000/api/health;
    }
}
