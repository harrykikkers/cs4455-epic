# Secure Messenger — nginx server block for zebra.theburkenator.com
#
# TLS is terminated at the hosting provider's gateway.
# This VM serves plain HTTP on port 80; the gateway handles HTTPS.

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80; # listen on port 80 for IPv4
    listen [::]:80; # listen on port 80 for IPv6
    server_name zebra.theburkenator.com; # only responds to requests for this hostname

    add_header X-Content-Type-Options "nosniff" always; # browser wont guess content type
    add_header X-Frame-Options "DENY" always; # cant embed within an iframe (clickjacking)
    add_header Referrer-Policy "no-referrer" always; # dont leak the url you came from
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always; # disables camera, mic, geolocation for this origin

    server_tokens off; # hides nginx version number for security through obscurity

    root  /var/www/verify;
    index verify.html;

    client_max_body_size 256k;
    limit_req zone=api burst=20 nodelay;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline' https://esm.sh; style-src 'unsafe-inline'; connect-src https://esm.sh https://ethereum-sepolia-rpc.publicnode.com https://1rpc.io https://rpc.sepolia.org; img-src 'self' data:; font-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

        try_files $uri $uri/ =404;
    }
}