# Secure Messenger — nginx server block for zebra.theburkenator.com
#
# Drop this file at /etc/nginx/sites-available/ and symlink into sites-enabled.
# Cert paths assume certbot has been run (see deploy/nginx/README.md).
#
# Architecture:
#   [client] ──TLS 1.2/1.3──▶ [nginx :443] ──HTTP loopback──▶ [node :3000]
#   nginx is the only process bound to a public interface.

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────
# Keep port 80 alive solely for (a) HTTP→HTTPS redirect and (b) the
# Let's Encrypt HTTP-01 challenge under /.well-known/acme-challenge/.
server {
    listen 80;
    listen [::]:80;
    server_name zebra.theburkenator.com;

    # Allow certbot renewals to land without a redirect dance
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zebra.theburkenator.com;

    # Certbot drops the chain + key here after `certbot --nginx`
    ssl_certificate     /etc/letsencrypt/live/zebra.theburkenator.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zebra.theburkenator.com/privkey.pem;

    # Modern TLS only. TLS 1.0/1.1 are deprecated by RFC 8996; SSL 3 is broken.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # Mozilla "intermediate" cipher suite — broad client support, no weak primitives.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling — clients verify the cert without an extra round-trip to the CA
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security headers ────────────────────────────────────────────────
    # HSTS — 2 years, include subdomains, preload-eligible. Once a client
    # has seen this, it will refuse to talk to *.theburkenator.com over plain HTTP.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # No CSP here — this server is an API. Add one if you start serving HTML.

    server_tokens off;

    # Static verification page lives here on the VM
    root  /var/www/verify;
    index verify.html;

    client_max_body_size 256k;
    limit_req zone=api burst=20 nodelay;

    # ── API → Node (loopback) ──
    # No add_header here, so the five server-level security headers are
    # inherited unchanged. XFF switched from $proxy_add_x_forwarded_for to
    # $remote_addr so a client-supplied X-Forwarded-For can't mint its own
    # rate-limit bucket (closes PENTEST F-03).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Verification page (static, served by nginx) ──
    # Any add_header inside a location cancels inheritance of the server-level
    # ones, so the full set is repeated here, plus a CSP scoped to exactly what
    # the page needs: inline script/style, esm.sh for ethers, the Sepolia RPCs.
    location / {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline' https://esm.sh; style-src 'unsafe-inline'; connect-src https://esm.sh https://ethereum-sepolia-rpc.publicnode.com https://1rpc.io https://rpc.sepolia.org; img-src 'self' data:; font-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

        try_files $uri $uri/ =404;
    }
}
