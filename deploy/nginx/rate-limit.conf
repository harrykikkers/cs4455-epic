# Drop at /etc/nginx/conf.d/rate-limit.conf
#
# 10 requests/sec per IP, with a 20-request burst. This is the OUTER bucket;
# the Node app has its own express-rate-limit configured for finer-grained
# per-route limits (notably 20/15min on /api/auth). The nginx limit exists
# so abusive clients are dropped before they reach Node at all.

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# Note: this file is not deployed to /etc/nginx/conf.d/ on the production VM.
# The limit_req_zone declaration is included directly in
# zebra.theburkenator.com.conf since the hosting provider's gateway
# handles TLS termination and the rate-limit.conf approach was designed
# for a standalone nginx+certbot setup.